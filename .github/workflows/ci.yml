# Third-party actions are pinned to full commit SHAs (looked up 2026-10-02 with git ls-remote and
# the GitHub API). Update the SHA and the trailing version comment together.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit message in the range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) python3 scripts/check_commits.py --base "$PR_BASE" --head "$PR_HEAD" ;;
            push)         python3 scripts/check_commits.py --base "$PUSH_BEFORE" --head "$PUSH_AFTER" ;;
            *)            python3 scripts/check_commits.py --head HEAD ;;
          esac

  lint-type:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - run: make lint type

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      # Unit and golden-file tests; pytest-socket blocks network access.
      - run: make test

  schemas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - run: make schemas

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (SHA-256 from the release's checksums.txt)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - name: Audit every locked dependency for known vulnerabilities
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/requirements.txt" > /dev/null
          uv run --frozen pip-audit --strict --disable-pip --require-hashes \
            --requirement "$RUNNER_TEMP/requirements.txt"

  # ADR-0007 item 10: real Syft and Grype against the 8 fixture images. Images are pinned by
  # digest (looked up 2026-10-02): registry:2 (index) and httpd:2.4-alpine (for htpasswd).
  integration:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [lint-type, test]
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - name: Install Syft 1.54.0 and Grype 0.119.0 (SHA-256 from each release's checksums file)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/syft.tar.gz" \
            https://github.com/anchore/syft/releases/download/v1.54.0/syft_1.54.0_linux_amd64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/grype.tar.gz" \
            https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.tar.gz
          printf '%s  %s\n' \
            54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860 "$RUNNER_TEMP/syft.tar.gz" \
            3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b "$RUNNER_TEMP/grype.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/bin" syft
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/bin" grype
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Download the Grype DB and record its status
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          grype db update
          grype db status -o json
      - name: Start a registry that needs credentials (password made fresh for this run)
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          mkdir -p "$RUNNER_TEMP/auth"
          docker run --rm --entrypoint htpasswd \
            httpd@sha256:4e585da9d0125dec36d4500a9f5c5df7b2c0a01f67cb47865a91a4b05bdbec1b \
            -Bbn fixproof "$password" > "$RUNNER_TEMP/auth/htpasswd"
          docker run -d --name auth-registry -p 5001:5000 -v "$RUNNER_TEMP/auth:/auth:ro" \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=fixproof \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for _ in $(seq 30); do curl -s -o /dev/null http://localhost:5001/v2/ && break; sleep 1; done
          echo "$password" | docker login localhost:5001 --username fixproof --password-stdin
      - name: Build and push the fixture images
        run: |
          uv run --frozen python scripts/build_fixtures.py --registry localhost:5000 \
            --auth-registry localhost:5001 --out "$RUNNER_TEMP/fixture-images.json"
      - name: Run the integration tests (fixproof runs with no registry credentials)
        env:
          FIXPROOF_IT_IMAGES: ${{ runner.temp }}/fixture-images.json
        run: make integration

  # The `release` job (tag v*: build, SBOM, PyPI trusted publishing) is added only after M6.
