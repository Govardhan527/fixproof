# Third-party actions are pinned to full commit SHAs (looked up 2026-10-02 with git ls-remote and
# the GitHub API). Update the SHA and the trailing version comment together.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit message in the range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) python3 scripts/check_commits.py --base "$PR_BASE" --head "$PR_HEAD" ;;
            push)         python3 scripts/check_commits.py --base "$PUSH_BEFORE" --head "$PUSH_AFTER" ;;
            *)            python3 scripts/check_commits.py --head HEAD ;;
          esac

  lint-type:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - run: make lint type

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      # Unit and golden-file tests; pytest-socket blocks network access.
      - run: make test

  schemas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - run: make schemas

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (SHA-256 from the release's checksums.txt)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - name: Audit every locked dependency for known vulnerabilities
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/requirements.txt" > /dev/null
          uv run --frozen pip-audit --strict --disable-pip --require-hashes \
            --requirement "$RUNNER_TEMP/requirements.txt"

  # ADR-0007 item 10: real Syft and Grype against the 8 fixture images. ADR-0010 item 9: the kind
  # demo cluster (scripts/demo_cluster.sh pins kind, kubectl, the node image, registry:2 and
  # httpd by digest) with the 6 SUCCESS TEST workloads and 2 real certbot releases.
  integration:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [lint-type, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - name: Install Syft 1.54.0 and Grype 0.119.0 (checksum-verified)
        run: |
          scripts/install_scanners.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Download the Grype DB and record its status
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          grype db update
          grype db status -o json
      - name: Start the registries, push the fixture images and create the kind demo cluster
        run: scripts/demo_cluster.sh up "$RUNNER_TEMP/demo"
      - name: Run the integration tests (fixproof gets a read-only token and no registry credentials)
        env:
          FIXPROOF_IT_IMAGES: ${{ runner.temp }}/demo/fixture-images.json
          FIXPROOF_IT_KUBECONFIG: ${{ runner.temp }}/demo/reader.kubeconfig
        run: make integration
      - name: Install fixproof with the README's command and run it as a user would
        env:
          KUBECONFIG: ${{ runner.temp }}/demo/reader.kubeconfig
          DOCKER_CONFIG: ${{ runner.temp }}/no-credentials
        run: |
          mkdir -p "$DOCKER_CONFIG"
          # The README's command, pinned to this commit: its own environment, its dependencies
          # resolved at install time, as a user gets them.
          uv tool install --python 3.12 "git+https://github.com/${{ github.repository }}@${{ github.sha }}"
          export PATH="$(uv tool dir --bin):$PATH"
          command -v fixproof
          fixproof --version
          printf '%s\n' 'schema_version: "1.0.0"' 'cve: CVE-2023-32681' 'packages:' \
            '  - ecosystem: pypi' '    name: requests' '    fixed_version: "2.31.0"' \
            > "$RUNNER_TEMP/fix.yaml"
          code=0
          fixproof verify --cve CVE-2023-32681 --fix "$RUNNER_TEMP/fix.yaml" \
            --scope examples/scope/kind-demo.yaml --out "$RUNNER_TEMP/evidence" \
            --author "fixproof CI demo" > "$RUNNER_TEMP/demo.out" || code=$?
          cat "$RUNNER_TEMP/demo.out"
          echo "exit code: $code"
          test "$code" -eq 1
          grep -q '^2 fixed, 3 still_affected, 1 unknown; evidence in' "$RUNNER_TEMP/demo.out"
      - name: Show the demo cluster's pods
        if: failure()
        run: |
          kubectl=("$RUNNER_TEMP/demo/bin/kubectl" --kubeconfig "$RUNNER_TEMP/demo/admin.kubeconfig")
          for namespace in fixproof-demo fixproof-live fixproof-edge; do
            "${kubectl[@]}" describe pods -n "$namespace" || true
          done
          "${kubectl[@]}" get events -A --sort-by=.lastTimestamp || true

  # ADR-0010 Amendment 2: the same checks on a node running Docker Engine through cri-dockerd
  # (minikube with --container-runtime=docker), pinned by scripts/demo_minikube.sh.
  integration-docker-runtime:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [lint-type, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - name: Install Syft 1.54.0 and Grype 0.119.0 (checksum-verified)
        run: |
          scripts/install_scanners.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Download the Grype DB and record its status
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          grype db update
          grype db status -o json
      - name: Start a minikube node with the Docker runtime and deploy the workloads
        run: scripts/demo_minikube.sh up "$RUNNER_TEMP/minikube"
      - name: Run the Docker-runtime integration tests (read-only token, no registry credentials)
        env:
          FIXPROOF_IT_DOCKER_KUBECONFIG: ${{ runner.temp }}/minikube/reader.kubeconfig
        run: make integration-docker
      - name: Install fixproof with the README's command and run it as a user would
        env:
          KUBECONFIG: ${{ runner.temp }}/minikube/reader.kubeconfig
          DOCKER_CONFIG: ${{ runner.temp }}/no-credentials
        run: |
          mkdir -p "$DOCKER_CONFIG"
          uv tool install --python 3.12 "git+https://github.com/${{ github.repository }}@${{ github.sha }}"
          export PATH="$(uv tool dir --bin):$PATH"
          fixproof --version
          printf '%s\n' 'schema_version: "1.0.0"' 'cve: CVE-2023-32681' 'packages:' \
            '  - ecosystem: pypi' '    name: requests' '    fixed_version: "2.31.0"' \
            > "$RUNNER_TEMP/fix.yaml"
          printf '%s\n' 'schema_version: "1.0.0"' 'registries: [docker.io]' 'clusters:' \
            '  - context: fixproof-docker' '    namespaces: [fixproof-docker]' \
            > "$RUNNER_TEMP/scope.yaml"
          code=0
          fixproof verify --cve CVE-2023-32681 --fix "$RUNNER_TEMP/fix.yaml" \
            --scope "$RUNNER_TEMP/scope.yaml" --out "$RUNNER_TEMP/evidence" \
            --author "fixproof CI demo" > "$RUNNER_TEMP/demo.out" || code=$?
          cat "$RUNNER_TEMP/demo.out"
          echo "exit code: $code"
          test "$code" -eq 1
          grep -q '^2 fixed, 2 still_affected, 1 unknown; evidence in' "$RUNNER_TEMP/demo.out"
      - name: Show the node's pods
        if: failure()
        run: |
          kubectl=("$RUNNER_TEMP/minikube/bin/kubectl" --kubeconfig "$RUNNER_TEMP/minikube/admin.kubeconfig")
          "${kubectl[@]}" describe pods -n fixproof-docker || true
          "${kubectl[@]}" get events -A --sort-by=.lastTimestamp || true

  # The `release` job (tag v*: build, SBOM, PyPI trusted publishing) is added only after M6.
