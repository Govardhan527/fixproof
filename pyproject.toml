[project]
name = "fixproof"
version = "0.0.0"
description = "Per-asset proof that a remediated CVE is gone from container images and Kubernetes workloads, emitted as OpenVEX plus an evidence bundle."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Govardhan" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Runtime dependencies are added in the milestone that first uses them (ADR-0002).
dependencies = [
    "jsonschema>=4.26",
    "packaging>=26.3",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    # jsonschema checks the OpenVEX schema's date-time, uri and iri formats only when these are
    # installed (ADR-0006, SPEC_NOTES §1).
    "rfc3339-validator>=0.1.4",
    "rfc3986-validator>=0.1.1",
    "rfc3987-syntax>=1.1.0",
    "typer>=0.27",
]

[project.scripts]
fixproof = "fixproof.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-socket>=0.7",
    "ruff>=0.13",
    "types-jsonschema>=4.25",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.9,<0.13"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]
# Ruff would reformat Python code blocks inside Markdown docs; keep it out of them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors, including E722 (bare except)
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
    "BLE", # blind except
    "PT",  # pytest style
    "S",   # bandit
]

[tool.ruff.lint.per-file-ignores]
# The repo scripts and their tests drive git through subprocess on purpose.
"scripts/*" = ["S603", "S607"]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--disable-socket"]
markers = [
    "integration: needs Docker, kind, Syft, Grype or network; runs in its own CI job",
    "live: reads real public images from Docker Hub with real Syft, Grype and the live DB",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
